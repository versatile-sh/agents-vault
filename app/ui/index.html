<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Versatile Vault</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="1.6" class="hub"/><path d="M12 3.8v16.4M4.9 7.9l14.2 8.2M4.9 16.1l14.2-8.2"/></svg>
      <span class="wordmark">vault<span>.sh</span></span>
    </div>
    <nav class="nav" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-tab="claude" aria-selected="true"><span>Claude Code</span><span class="count"></span></button>
      <button type="button" role="tab" data-tab="codex" aria-selected="false"><span>Codex</span><span class="count"></span></button>
      <button type="button" role="tab" data-tab="keys" aria-selected="false"><span>API keys</span><span class="count"></span></button>
    </nav>
    <button type="button" id="open-settings" class="side-link" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Settings</span>
    </button>
  </aside>

  <main>
    <div class="column">
      <header class="page">
        <div class="page-title">
          <h1 id="page-title"></h1>
          <p id="page-caption" class="caption"></p>
        </div>
        <div class="page-actions">
          <button type="button" id="refresh" class="ghost" title="Refresh limits" aria-label="Refresh limits"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
          <button type="button" class="primary" id="add-button"></button>
        </div>
      </header>
      <ul id="accounts" class="list" aria-label="Accounts"></ul>
      <ul id="providers" class="list" aria-label="API keys" hidden></ul>
      <section id="empty" class="empty" hidden>
        <h2></h2>
        <p></p>
        <button type="button" class="primary" id="empty-add"></button>
      </section>
    </div>
  </main>
</div>

<p id="notice" class="toast" role="status" aria-live="polite"></p>

<dialog id="add" aria-labelledby="add-title">
  <form method="dialog" id="add-form">
    <header>
      <h2 id="add-title">Add account</h2>
      <button type="button" class="close" data-close aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </header>
    <div class="body">
      <fieldset class="options" aria-label="How it signs in">
        <label><input type="radio" name="mode" value="login" checked><span><strong>Sign in</strong><small>Opens the official sign-in in a terminal. Your token is never read or copied.</small></span></label>
        <label><input type="radio" name="mode" value="key"><span><strong>API key</strong><small>Stored in your system keychain and handed to the session when it starts.</small></span></label>
        <label><input type="radio" name="mode" value="adopt"><span><strong>Existing login</strong><small>Tracks a folder you already use, in place. Nothing is moved.</small></span></label>
      </fieldset>
      <label class="field"><span class="label">Name</span><input name="label" required maxlength="80" autocomplete="off" placeholder="Work, Personal…"></label>
      <label class="field" data-mode="key" hidden><span class="label">API key</span><input name="key" type="password" autocomplete="off" spellcheck="false"></label>
      <label class="field" data-mode="key" hidden><span class="label">Endpoint <small>optional</small></span><input name="base_url" class="mono" autocomplete="off" spellcheck="false" placeholder="https://"></label>
      <label class="check" data-mode="key" hidden><input name="bearer" type="checkbox">Send the key as a bearer token</label>
      <label class="field" data-mode="login key"><span class="label">Model <small>optional</small></span><input name="model" class="mono" autocomplete="off" spellcheck="false" placeholder="every session starts on it"></label>
      <label class="field" data-mode="key" hidden><span class="label">Fast model <small>optional</small></span><input name="fast_model" class="mono" autocomplete="off" spellcheck="false" placeholder="for background tasks"></label>
      <label class="field" data-mode="adopt" hidden><span class="label">Folder <small>optional</small></span><input name="dir" class="mono" autocomplete="off" spellcheck="false" placeholder="the default home when empty"></label>
      <p class="error" role="alert"></p>
    </div>
    <footer><button type="button" class="quiet" data-close>Cancel</button><button type="submit" class="primary">Add account</button></footer>
  </form>
</dialog>

<dialog id="edit" aria-labelledby="edit-title">
  <form method="dialog" id="edit-form">
    <header>
      <h2 id="edit-title">Account</h2>
      <button type="button" class="close" data-close aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </header>
    <div class="body">
      <label class="field"><span class="label">Name</span><input name="label" required maxlength="80" autocomplete="off"></label>
      <label class="field"><span class="label">Model <small>optional</small></span><input name="model" class="mono" autocomplete="off" spellcheck="false"></label>
      <label class="field" data-only="key"><span class="label">Fast model <small>optional</small></span><input name="fast_model" class="mono" autocomplete="off" spellcheck="false"></label>
      <label class="field" data-only="key"><span class="label">Replace API key <small>empty keeps the current one</small></span><input name="key" type="password" autocomplete="off" spellcheck="false"></label>
      <label class="check" data-only="managed"><input name="kit" type="checkbox">Link the shared instructions folder</label>
      <p class="error" role="alert"></p>
    </div>
    <footer class="spread">
      <span>
        <button type="button" class="link danger" id="remove">Remove</button>
        <button type="button" class="link" id="relogin" data-only="login">Sign in again</button>
      </span>
      <span><button type="button" class="quiet" data-close>Cancel</button><button type="submit" class="primary">Save</button></span>
    </footer>
  </form>
</dialog>

<dialog id="provider" aria-labelledby="provider-title">
  <form method="dialog" id="provider-form">
    <header>
      <h2 id="provider-title">Add API key</h2>
      <button type="button" class="close" data-close aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </header>
    <div class="body">
      <fieldset class="options compact" aria-label="Provider" id="presets"></fieldset>
      <label class="field"><span class="label">Name</span><input name="label" required maxlength="80" autocomplete="off" placeholder="My gateway"></label>
      <label class="field"><span class="label">API key <small data-only="edit">empty keeps the current one</small></span><input name="key" type="password" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span class="label">Models <small>first is the default</small></span><input name="models" class="mono" autocomplete="off" spellcheck="false" placeholder="vendor/model another-model"></label>
      <details id="advanced">
        <summary>Endpoints and tool</summary>
        <label class="field"><span class="label">Anthropic-compatible endpoint <small>Claude Code</small></span><input name="anthropic_url" class="mono" autocomplete="off" spellcheck="false" placeholder="https://"></label>
        <label class="field"><span class="label">OpenAI-compatible endpoint <small>Codex and others</small></span><input name="openai_url" class="mono" autocomplete="off" spellcheck="false" placeholder="https://"></label>
        <label class="field"><span class="label">Key variable</span><input name="key_env" class="mono" required autocomplete="off" spellcheck="false" placeholder="PROVIDER_API_KEY"></label>
        <label class="field"><span class="label">Tool command <small>optional</small></span><input name="command" class="mono" autocomplete="off" spellcheck="false" placeholder="opencode"></label>
      </details>
      <p class="error" role="alert"></p>
    </div>
    <footer class="spread">
      <span><button type="button" class="link danger" id="remove-provider" data-only="edit">Remove</button></span>
      <span><button type="button" class="quiet" data-close>Cancel</button><button type="submit" class="primary">Save</button></span>
    </footer>
  </form>
</dialog>

<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" id="settings-form">
    <header>
      <h2 id="settings-title">Settings</h2>
      <button type="button" class="close" data-close aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </header>
    <div class="body">
      <p class="lede">Shared instructions are linked into every managed account: CLAUDE.md or AGENTS.md, skills, commands and agents.</p>
      <label class="field"><span class="label">Claude Code instructions folder</span><input name="claude_kit" class="mono" autocomplete="off" spellcheck="false" placeholder="/home/you/.claude"></label>
      <label class="field"><span class="label">Codex instructions folder</span><input name="codex_kit" class="mono" autocomplete="off" spellcheck="false" placeholder="/home/you/.codex"></label>
      <label class="field"><span class="label">Terminal command <small>detected when empty</small></span><input name="terminal" class="mono" autocomplete="off" spellcheck="false" placeholder="kitty -e"></label>
      <p class="error" role="alert"></p>
    </div>
    <footer><button type="button" class="quiet" data-close>Cancel</button><button type="submit" class="primary">Save</button></footer>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
