[tools]
rust = "1.99.1"
python = "3.13"

[tasks.fmt]
description = "Format the Rust workspace"
run = "cargo fmt --all"

[tasks.lint]
description = "rustfmt check and clippy on the whole workspace"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets"]

[tasks.test]
description = "Workspace tests"
run = "cargo test --workspace"

[tasks.build]
description = "Release build of the CLI and the app"
run = ["cargo build --release -p vvault", "cargo build --release -p vvault-app --features custom-protocol"]

[tasks.dev]
description = "Run the CLI against a throwaway ledger: mise run dev -- <vvault args>"
env = { VVAULT_HOME = "/tmp/vvault-dev" }
run = "cargo run -p vvault --"

[tasks.icons]
description = "Render the app and tray icons"
run = "python3 scripts/icons.py"

[tasks.semgrep]
description = "Semgrep on the new findings since the merge base"
run = """
semgrep scan --metrics=off --disable-version-check --error --severity WARNING --severity ERROR \
  --config p/default --config p/secrets --config p/javascript --config p/rust --config p/python \
  --config https://raw.githubusercontent.com/versatile-sh/semgrep-rules/v0.1.2/rules/versatile.yml \
  --baseline-commit "$(git merge-base HEAD origin/main)"
"""

[tasks.check]
description = "Local merge validation: format, clippy, tests, Semgrep"
run = [{ task = "lint" }, { task = "test" }, { task = "semgrep" }]
